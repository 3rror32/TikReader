<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de caminatas</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#101c24;color:#eaf4f4;font:15px system-ui}header{max-width:1400px;margin:auto}h1{font-size:26px;margin:0 0 8px}p{color:#acbfc8}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}button,select,input{font:inherit}button,select{padding:8px 12px;background:#20353f;border:1px solid #52717f;border-radius:6px;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;max-width:1400px;margin:auto}article{background:#20313b;border:1px solid #39535f;border-radius:6px;overflow:hidden}h2{font-size:14px;margin:12px 14px}small{color:#96b5bd;font-weight:400}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}</style>
<header><h1>Revisión de caminatas</h1><p>80 personajes · 24 poses por ciclo. Los ejemplos no agregan donadores al LIVE.</p><nav><label>Colección <select id="theme"><option value="all">Todas</option></select></label><button id="pause">Pausar</button><button id="step">Siguiente pose</button><label>Velocidad <input id="speed" type="range" min="0" max="60" value="30"></label><label><input id="travel" type="checkbox" checked> Desplazarse</label><label><input id="joints" type="checkbox"> Ver apoyos</label></nav></header><main class="grid"></main>
<script src="review-data.js"></script><script>
const labels={fantasia:'Dragones',mascotas:'Mascotas',dinosaurios:'Dinosaurios',cyborgs:'Robots',chibis:'Personas chibi',elfos:'Elfos',goblins:'Goblins',monstruos:'Monstruos'};
const $=id=>document.getElementById(id),actors=[];let running=true,last=0,tracks={};
fetch('joint-tracks.json').then(r=>r.json()).then(d=>tracks=d);
for(const [value,text] of Object.entries(labels)){const o=document.createElement('option');o.value=value;o.textContent=text;$('theme').append(o)}
for(const [key,meta]of Object.entries(REVIEW_DATA)){const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas');const theme=key.slice(0,key.lastIndexOf('-'));title.textContent=labels[theme]+' '+(Number(key.split('-').at(-1))+1);const small=document.createElement('small');small.textContent=' · '+meta.legs+' patas';title.append(small);canvas.width=300;canvas.height=164;article.append(title,canvas);document.querySelector('main').append(article);const img=new Image();img.src=key+'.png?v=3';actors.push({key,meta,theme,article,canvas,img,x:60,dir:1,phase:0,frame:0})}
$('theme').onchange=()=>{for(const a of actors)a.article.hidden=$('theme').value!=='all'&&a.theme!==$('theme').value};
$('pause').onclick=()=>{running=!running;$('pause').textContent=running?'Pausar':'Continuar'};
$('step').onclick=()=>{running=false;$('pause').textContent='Continuar';for(const a of actors)a.phase=(a.phase+1/a.meta.frames)%1};
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;for(const a of actors){if(a.article.hidden)continue;const ctx=a.canvas.getContext('2d');const speed=Math.min(Number($('speed').value),a.meta.stride*128*1.8);if(running){a.phase=(a.phase+speed*dt/(128*a.meta.stride))%1;if($('travel').checked){a.x+=a.dir*speed*dt;if(a.x>164){a.x=164;a.dir=-1}if(a.x<8){a.x=8;a.dir=1}}}const f=Math.floor(a.phase*a.meta.frames);a.frame=f;a.canvas.dataset.frame=f;ctx.clearRect(0,0,300,164);ctx.fillStyle='#55747f';ctx.fillRect(0,144,300,1);if(a.img.complete&&a.img.naturalWidth){ctx.save();const x=$('travel').checked?a.x:86;ctx.translate(x+(a.dir<0?128:0),24);ctx.scale(a.dir,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(a.img,f*128,0,128,128,0,0,128,128);if($('joints').checked&&tracks[a.key])for(const leg of tracks[a.key][f]){ctx.strokeStyle=leg.support?'#65ff9e':'#ffb356';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(...leg.root);ctx.lineTo(...leg.knee);ctx.lineTo(...leg.foot);ctx.stroke();ctx.fillStyle=ctx.strokeStyle;ctx.fillRect(leg.foot[0]-2,leg.foot[1]+3,4,2)}ctx.restore();}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
