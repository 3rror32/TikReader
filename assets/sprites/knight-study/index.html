<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caballero · prueba de caminata</title><style>
*{box-sizing:border-box}body{margin:0;background:#182a34;color:#f2f6f7;font:16px system-ui;padding:28px}main{max-width:850px;margin:auto}h1{font-size:25px}p{color:#acc0ca}.stage{height:360px;position:relative;overflow:hidden;border:1px solid #385460;border-radius:8px;background:#23353e}.floor{position:absolute;bottom:25px;height:1px;background:#54717b;width:100%}.sprite{position:absolute;bottom:16px;width:256px;height:256px;overflow:hidden}.sprite img{display:block;max-width:none;width:1200%;height:100%;image-rendering:pixelated}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}button,select{padding:8px 12px;background:#294451;color:white;border:1px solid #60808d;border-radius:5px;font:inherit}a{color:#77e6d1}output{font-variant-numeric:tabular-nums}@media(max-width:600px){body{padding:16px}.sprite{width:192px;height:192px}.stage{height:300px}}</style>
<main><h1>Caballero · prueba de caminata</h1><p>Una nueva secuencia de 12 poses dibujadas, con capa y penacho en movimiento.</p><div class="stage"><div class="floor"></div><div class="sprite"><img src="chibis-0.png" alt="Caballero con capa roja caminando"></div></div><nav><button id="play">Pausar</button><button id="step">Siguiente pose</button><label><input type="checkbox" id="travel" checked> Desplazarse</label><label>Ritmo <select id="fps"><option value="8">Lento</option><option value="12" selected>Normal</option><option value="16">Rápido</option></select></label><output id="frame"></output></nav><p><a href="poses.png">Ver todas las poses</a> · <a href="../walk-v2/chibis-0-bkc.png">Respaldo bkc</a></p></main>
<script>
const sprite=document.querySelector('.sprite'),art=sprite.querySelector('img'),stage=document.querySelector('.stage'),$=id=>document.getElementById(id);let playing=true,phase=0,x=30,dir=1,last=0;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pausar':'Continuar'};$('step').onclick=()=>{playing=false;$('play').textContent='Continuar';phase=(Math.floor(phase)+1)%12};
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;const width=sprite.clientWidth,max=Math.max(0,stage.clientWidth-width);if(playing){phase=(phase+dt*Number($('fps').value))%12;if($('travel').checked){x+=dir*dt*Number($('fps').value)/12*width*.32;if(x>=max){x=max;dir=-1}if(x<=0){x=0;dir=1}}}const f=Math.floor(phase);sprite.style.left=($('travel').checked?Math.max(0,Math.min(max,x)):max/2)+'px';sprite.style.transform=`scaleX(${dir})`;art.style.transform=`translateX(${-100*f/12}%)`;$('frame').textContent=`Pose ${f+1} / 12`;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
