name: Calidad

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-dev.txt
      - name: Instalar dependencias web
        run: npm ci
      - name: Validar programa, interfaz e instalador
        run: python tools/check_changes.py
      - name: Conservar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad-${{ github.run_number }}
          path: runtime/.coverage
          if-no-files-found: error
          retention-days: 14
