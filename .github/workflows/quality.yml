name: Calidad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-dev.txt
      - name: Instalar dependencias web
        run: npm ci
      - name: Validar programa, interfaz e instalador
        run: python tools/check_changes.py
