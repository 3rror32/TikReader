name: Calidad

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias Python
        run: python -m pip install -r requirements-dev.txt
      - name: Instalar dependencias web
        run: npm ci
      - name: Install pinned operator test browser
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/runtime/playwright-browsers
      - name: Verify operator browser contracts
        run: npm run test:operator
      - name: Validar programa, interfaz e instalador
        if: ${{ !cancelled() }}
        run: python tools/check_changes.py
      - name: Conservar reporte de cobertura
        if: ${{ always() && hashFiles('runtime/.coverage') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad-${{ github.run_number }}
          path: runtime/.coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve operator browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-browser-${{ github.run_number }}
          path: runtime/operator-browser
          if-no-files-found: ignore
          retention-days: 14
