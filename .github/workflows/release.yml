name: Publicar instalador

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar herramientas
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Validar antes de empaquetar
        run: python tools/check_changes.py
      - name: Crear instalador verificado
        shell: powershell
        run: ./packaging/build_installer.ps1
      - name: Adjuntar instalador a la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: TikReader-Windows-${{ github.ref_name }}
          path: |
            release/TikReader-*-Beta-Setup.exe
            release/TikReader/distribution.json
          if-no-files-found: error
      - name: Prepare beta release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/TikReader-*-Beta-Setup.exe
          generate_release_notes: true
          body_path: docs/BETA_RELEASE_NOTES.md
          draft: true
          prerelease: true
